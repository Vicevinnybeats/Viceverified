name: Make Shorts

# The daily run. Started twice a day (06:13 / 18:13 UTC) by your Scout Worker's timer
# (GitHub's own timer skips runs), or by hand with "Run workflow".
#   scout  - the Scout searches for new GTA 6 news and clips (morning run also saves the list)
#   plan   - pick the Scout's best finds, Qwen writes the scripts
#   voice  - VoiceStudio (https://github.com/debpalash/VoiceStudio) records the voiceovers
#   render - builds the videos; if a VoiceStudio voiceover is missing, Cloudflare's voice is used
# Finished Shorts go to Google Drive Viceverified/Inbox (if Google is set up) and are
# always downloadable from the run page under "Artifacts".
on:
  # Paused: the daily start from the Scout is switched off. To turn back on, add again:
  #   repository_dispatch:
  #     types: [daily-run]
  workflow_dispatch:
    inputs:
      scout:
        description: "Let the Scout search for new finds first"
        type: boolean
        default: true
      news:
        description: "How many guide/secret/money Shorts"
        default: "2"
      clips:
        description: "How many stream-clip Shorts"
        default: "0"
      dry_run:
        description: "Dry run (only list what it would make)"
        type: boolean
        default: false

concurrency:
  group: make-shorts
  cancel-in-progress: false

env:
  SCOUT_KEY: ${{ secrets.SCOUT_KEY }}
  NEWS_PER_RUN: ${{ inputs.news || vars.NEWS_PER_RUN || '2' }}
  CLIPS_PER_RUN: ${{ inputs.clips || vars.CLIPS_PER_RUN || '0' }}
  CLIP_STREAMERS: ${{ vars.CLIP_STREAMERS }}
  CLIP_ALLOW: ${{ vars.CLIP_ALLOW }}

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'repository_dispatch' || inputs.scout }}
    steps:
      - name: Scout searches for new GTA 6 news and clips
        env:
          REPORT: ${{ github.event.client_payload.report && '1' || '' }}
        run: |
          curl -fsS --retry 2 --max-time 300 -X POST \
            -H "Authorization: Bearer $SCOUT_KEY" \
            "https://viceverified-scout.vicevinnybeats.workers.dev/api/run${REPORT:+?report=1}"
          echo

  plan:
    needs: scout
    # Daily automatic Shorts are paused (only the Scout runs). Turn back on: repo variable AUTO_SHORTS = true.
    # "Run workflow" by hand still makes Shorts.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || vars.AUTO_SHORTS == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      news: ${{ steps.plan.outputs.news }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Pick finds and write scripts
        id: plan
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python -m maker run --dry-run; echo "news=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -m maker plan plan.json
          echo "news=$(python3 -c 'import json; print(len(json.load(open("plan.json"))["news"]))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: plan
          path: plan.json
          retention-days: 2

  voice:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.news != '0' && vars.USE_VOICESTUDIO != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Free disk space for VoiceStudio
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af > /dev/null || true
          df -h / | tail -1
      - name: Restore VoiceStudio voice models (downloaded once, then cached)
        uses: actions/cache@v4
        with:
          path: ~/voicestudio-data
          key: voicestudio-data-v1
      - name: Start VoiceStudio
        env:
          REMOTE_URL: ${{ secrets.VOICESTUDIO_URL }}
          REMOTE_KEY: ${{ secrets.VOICESTUDIO_KEY }}
        run: |
          if [ -n "$REMOTE_URL" ]; then
            echo "Using your own VoiceStudio (VOICESTUDIO_URL secret)"
            echo "VOICESTUDIO_URL=$REMOTE_URL" >> "$GITHUB_ENV"
            echo "VOICESTUDIO_KEY=$REMOTE_KEY" >> "$GITHUB_ENV"
            exit 0
          fi
          KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$KEY"
          mkdir -p ~/voicestudio-data
          docker pull -q ghcr.io/debpalash/voicestudio:stable
          df -h / | tail -1
          docker run -d --name omnivoice -p 127.0.0.1:3900:3900 \
            -e OMNIVOICE_API_KEY="$KEY" -e OMNIVOICE_DATA_DIR=/app/omnivoice_data \
            -v "$HOME/voicestudio-data:/app/omnivoice_data" \
            ghcr.io/debpalash/voicestudio:stable
          echo "VOICESTUDIO_URL=http://127.0.0.1:3900" >> "$GITHUB_ENV"
          echo "VOICESTUDIO_KEY=$KEY" >> "$GITHUB_ENV"
          echo "Waiting for VoiceStudio (the first run downloads its voice model)..."
          for i in $(seq 1 240); do
            if curl -fsS -H "Authorization: Bearer $KEY" http://127.0.0.1:3900/health; then echo; echo "VoiceStudio is up"; exit 0; fi
            if ! docker ps -q -f name=omnivoice | grep -q .; then echo "VoiceStudio stopped"; break; fi
            sleep 5
          done
          docker logs --tail 80 omnivoice || true
          exit 1
      - name: Install the KittenTTS voice (Apache-2.0) in VoiceStudio
        env:
          VOICESTUDIO_INSTALL: ${{ vars.VOICESTUDIO_INSTALL || 'KittenML/kitten-tts-mini-0.8' }}
          VOICESTUDIO_ACCEPT_LICENSE: ${{ vars.VOICESTUDIO_ACCEPT_LICENSE || 'KittenML/kitten-tts-mini-0.8' }}
        run: python -m maker voice-setup
      - name: Record voiceovers
        env:
          VOICESTUDIO_MODEL: ${{ vars.VOICESTUDIO_MODEL || 'kittentts' }}
          VOICESTUDIO_VOICE: ${{ vars.VOICESTUDIO_VOICE || 'expr-voice-3-m' }}
        run: python -m maker voices plan.json voices
      - name: VoiceStudio log (for troubleshooting)
        if: always()
        run: |
          df -h / | tail -1
          free -h | head -2
          docker logs --tail 80 omnivoice 2>&1 || echo "VoiceStudio was not started"
          # VoiceStudio writes as root; let the cache step read its files
          sudo chmod -R a+rX ~/voicestudio-data 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voices
          path: voices/
          retention-days: 2
          if-no-files-found: ignore

  render:
    needs: [plan, voice]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg, yt-dlp and the caption font
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core > /dev/null)
          pip install -q -r requirements.txt yt-dlp
          mkdir -p maker/fonts
          curl -sSfL -o maker/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || echo "font download failed - using a default bold font"
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voices
          path: voices
      - name: Make Shorts
        run: mkdir -p voices && python -m maker render plan.json voices
      - name: Post the new Shorts (YouTube, Instagram, TikTok - whichever are set up)
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
          POSTER_PLATFORMS: ${{ vars.POSTER_PLATFORMS || 'youtube,instagram,tiktok' }}
        run: python -m poster folder out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
