name: Deploy Scout

# Puts the Daily Scout Worker on your Cloudflare account and copies the
# secrets from GitHub into it. Runs on every change to scout/ or by hand.
on:
  push:
    paths: ["scout/**", ".github/workflows/scout-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scout
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Install wrangler
        run: npm install --no-audit --no-fund
      - name: Deploy Worker
        # a brand-new Worker can take a few seconds to register; retry once
        run: npx wrangler deploy || (sleep 20 && npx wrangler deploy)
      - name: Copy secrets into the Worker (only the ones you filled in)
        env:
          GITHUB_TOKEN: ${{ secrets.SCOUT_GITHUB_TOKEN }}
          SCOUT_KEY: ${{ secrets.SCOUT_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          node -e '
            const names = ["GITHUB_TOKEN","SCOUT_KEY","TWITCH_CLIENT_ID","TWITCH_CLIENT_SECRET",
              "YOUTUBE_API_KEY","DISCORD_WEBHOOK_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID",
              "REDDIT_CLIENT_ID","REDDIT_CLIENT_SECRET"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync(".secrets.json", JSON.stringify(out));
            console.log("Secrets to set:", Object.keys(out).join(", ") || "none");
          '
          if [ "$(cat .secrets.json)" != "{}" ]; then npx wrangler secret bulk .secrets.json; fi
          rm -f .secrets.json
